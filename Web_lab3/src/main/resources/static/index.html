<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список студентов</title>
    <link rel="stylesheet" href="styles.css?v=2">
    <link rel="icon" type="image/png" href="my_cat.png">
</head>
<body>
    <header><h1>Управление студентами</h1><div id="user-nav"></div></header>
    <main><div id="page-error" class="errors" role="alert"></div>
        <section id="list-page" class="page">
            <div class="toolbar">
                <input id="search" placeholder="ФИО или ИСУ">
                <select id="filter-foreigner"><option value="">Все студенты</option><option value="true">Иностранцы</option><option value="false">Не иностранцы</option></select>
                <select id="sort-by"><option value="fullName">По ФИО</option><option value="group">По группе</option><option value="isuId">По ИСУ</option><option value="room">По комнате</option><option value="moveInDate">По дате</option></select>
                <select id="direction"><option value="asc">По возрастанию</option><option value="desc">По убыванию</option></select>
                <input type="text" id="filter-group" placeholder="Группа">
                <input type="number" id="filter-dormitory" placeholder="Общежитие">
                <button id="filter-btn" class="btn-filter">Найти</button>
                <a href="form.html" id="add-link" class="btn-add">Добавить студента</a>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ФИО</th><th>Группа</th><th>ИСУ ID</th>
                            <th>Общежитие</th><th>Комната</th>
                            <th>Срок заселения</th><th>Иностранец</th><th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="student-table-body"></tbody>
                </table>
            </div>
        <div class="pagination"><button id="prev-page">Назад</button><span id="page-info"></span><button id="next-page">Далее</button></div></section>
    </main>
    <script type="module" src="js/app.js"></script>
</body>
</html>
