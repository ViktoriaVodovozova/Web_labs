<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="my_cat.png">
</head>
<body>
    <header><h1>Управление студентами</h1></header>
    <main><section class="page">
        <h2>Вход и регистрация</h2>
        <form id="auth-form">
            <div class="form-group"><label for="username">Имя пользователя</label>
                <input id="username" required maxlength="50" autocomplete="username"></div>
            <div class="form-group" id="email-row" hidden><label for="email">Электронная почта</label>
                <input id="email" type="email" maxlength="254" autocomplete="email"></div>
            <div class="form-group"><label for="password">Пароль</label>
                <input id="password" type="password" required maxlength="72" autocomplete="current-password"></div>
            <label><input id="register-mode" type="checkbox"> Создать нового пользователя</label>
            <div class="form-actions"><button id="auth-submit" type="submit">Войти</button></div>
            <div id="auth-error" class="errors" role="alert"></div>
        </form>
    </section></main>
    <script type="module" src="js/login.js"></script>
</body>
</html>
