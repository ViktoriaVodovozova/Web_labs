spring.application.name=students
server.port=${SERVER_PORT:8000}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/students}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
app.jwt.secret=${JWT_SECRET}
app.jwt.access-seconds=${JWT_ACCESS_SECONDS:900}
app.jwt.refresh-seconds=${JWT_REFRESH_SECONDS:604800}
app.admin.password=${ADMIN_PASSWORD:}
logging.level.students=INFO
