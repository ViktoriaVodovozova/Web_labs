map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream frontend     { server frontend:3000; }
upstream java_backend { server java-backend:8000; }
upstream node_rt      { server node-realtime:3001; }

server {
    listen 80;
    server_name _;
    client_max_body_size 55m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Служебный канал Java -> Node (скрываем снаружи)
    location ^~ /rt/internal/ { return 404; }

    # Запросы к Node.js (WebSocket, аудит, импорт/экспорт)
    location /rt/ {
        proxy_pass http://node_rt/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Запросы на авторизацию (логин/регистрация) идем в Next.js (чтобы он поставил куки)
    location /api/auth/ {
        proxy_pass http://frontend;
    }

    # Остальные API запросы (студенты) идем в Java
    location /api/ {
        proxy_pass http://java_backend;
    }

    # Всё остальное - в Next.js (фронтенд)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}