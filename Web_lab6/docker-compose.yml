services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - java-backend
      - node-realtime

  frontend:
    build: ./frontend
    environment:
      INTERNAL_API_URL: http://java-backend:8000
    restart: unless-stopped

  java-backend:
    build: ./java-backend
    environment:
      SERVER_PORT: 8000
      DB_URL: jdbc:h2:file:/app/data/students
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      REALTIME_URL: http://node-realtime:3001/internal/events
      SERVICE_KEY: ${SERVICE_KEY:?Set SERVICE_KEY in .env}
    volumes:
      - students-data:/app/data
    restart: unless-stopped

  node-realtime:
    build: ./node-realtime
    environment:
      PORT: 3001
      JAVA_URL: http://java-backend:8000
      SERVICE_KEY: ${SERVICE_KEY:?Set SERVICE_KEY in .env}
      ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      DATA_DIR: /data
    volumes:
      - rt-data:/data
    restart: unless-stopped

volumes:
  students-data:
  rt-data: