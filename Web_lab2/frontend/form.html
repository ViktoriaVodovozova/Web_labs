<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма студента</title>
    <link rel="stylesheet" href="styles.css?v=2">
    <link rel="icon" type="image/png" href="my_cat.png">
</head>
<body>
    <header><h1>Управление студентами</h1></header>
    <main>
        <section id="form-page" class="page">
            <h2 id="form-title"> Добавление студента</h2>
            <form id="student-form" novalidate onsubmit="return handleFormSubmit(event)">
                <input type="hidden" id="edit-id" name="edit-id">

                <div class="form-group">
                    <label for="fullName">ФИО <span class="required">*</span></label>
                    <input type="text" id="fullName" name="fullName" required>
                </div>
                <div class="form-group">
                    <label for="group">Группа <span class="required">*</span></label>
                    <input type="text" id="group" name="group" required>
                </div>
                <div class="form-group">
                    <label for="isuId">ИСУ ID <span class="required">*</span></label>
                    <input type="text" id="isuId" name="isuId" required pattern="\d{6}" maxlength="6" inputmode="numeric" placeholder="6 цифр">
                </div>
                <div class="form-group">
                    <label for="dormitory">Номер общежития <span class="required">*</span></label>
                    <input type="number" id="dormitory" name="dormitory" required min="1">
                </div>
                <div class="form-group">
                    <label for="room">Комната <span class="required">*</span></label>
                    <input type="number" id="room" name="room" required min="1">
                </div>
                <div class="form-group">
                    <label for="moveInDate">Срок заселения <span class="required">*</span></label>
                    <input type="date" id="moveInDate" name="moveInDate" required min="1970-08-25">
                </div>
                <div class="form-group checkbox">
                    <label for="isForeigner">Иностранец</label>
                    <input type="checkbox" id="isForeigner" name="isForeigner">
                </div>
                <div class="form-group">
                    <label for="notes">Заметки</label>
                    <textarea id="notes" name="notes" rows="3"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" id="save-btn"> Сохранить</button>
                    <a href="index.html" class="btn-cancel"> Отмена</a>
                </div>
                <div id="form-errors" class="errors"></div>
            </form>
        </section>
    </main>
    <script type="module" src="js/app.js"></script>
</body>
</html>
