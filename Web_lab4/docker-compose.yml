services:
  backend:
    build: ./backend
    environment:
      SERVER_PORT: 8000
      DB_URL: jdbc:h2:file:/app/data/students
      JWT_SECRET: ${JWT_SECRET:-lab4-development-key-change-before-production-0123456789}
      JWT_ACCESS_SECONDS: ${JWT_ACCESS_SECONDS:-900}
      JWT_REFRESH_SECONDS: ${JWT_REFRESH_SECONDS:-604800}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin12345}
    volumes:
      - students-data:/app/data
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      API_UPSTREAM: backend:8000
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  students-data:
